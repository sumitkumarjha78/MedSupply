spring.config.import=optional:file:.env[.properties]

spring.application.name=${SPRING_APPLICATION_NAME:api-gateway}
server.port=${SERVER_PORT:8080}

# 1. Auth Service (Port 8081)
spring.cloud.gateway.server.webflux.routes[0].id=auth-service
spring.cloud.gateway.server.webflux.routes[0].uri=${AUTH_SERVICE_BASE_URL:http://localhost:8081}
spring.cloud.gateway.server.webflux.routes[0].predicates[0]=Path=/api/auth/**

# 2. Product Service (Port 8082)
spring.cloud.gateway.server.webflux.routes[1].id=product-service
spring.cloud.gateway.server.webflux.routes[1].uri=${PRODUCT_SERVICE_BASE_URL:http://localhost:8082}
spring.cloud.gateway.server.webflux.routes[1].predicates[0]=Path=/api/products/**

# 3. Inventory Service (Port 8083)
spring.cloud.gateway.server.webflux.routes[2].id=inventory-service
spring.cloud.gateway.server.webflux.routes[2].uri=${INVENTORY_SERVICE_BASE_URL:http://localhost:8083}
spring.cloud.gateway.server.webflux.routes[2].predicates[0]=Path=/api/inventory/**

# 4. Order Service (Port 8084)
spring.cloud.gateway.server.webflux.routes[3].id=order-service
spring.cloud.gateway.server.webflux.routes[3].uri=${ORDER_SERVICE_BASE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[3].predicates[0]=Path=/api/orders/**

# 5. CoinDrop Payment Validation & Webhook Routes (Order Service - Port 8084)
spring.cloud.gateway.server.webflux.routes[4].id=coindrop-payments
spring.cloud.gateway.server.webflux.routes[4].uri=${ORDER_SERVICE_BASE_URL:http://localhost:8084}
spring.cloud.gateway.server.webflux.routes[4].predicates[0]=Path=/api/payments/coindrop/**

# CORS Configuration for React Frontend (Vite)
spring.cloud.gateway.server.webflux.globalcors.add-to-simple-url-handler-mapping=true
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedOriginPatterns=${CORS_ALLOWED_ORIGIN_PATTERNS:http://localhost:*}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedMethods=${CORS_ALLOWED_METHODS:GET,POST,PUT,PATCH,DELETE,OPTIONS}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowedHeaders=${CORS_ALLOWED_HEADERS:*}
spring.cloud.gateway.server.webflux.globalcors.cors-configurations.[/**].allowCredentials=${CORS_ALLOW_CREDENTIALS:true}

# Must match auth-service jwt.secret
jwt.secret=${JWT_SECRET}