spring.config.import=optional:file:.env[.properties]

spring.application.name=${SPRING_APPLICATION_NAME:order-service}
server.port=${SERVER_PORT:8084}

spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:true}
spring.jpa.properties.hibernate.format_sql=${SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL:true}

product-service.base-url=${PRODUCT_SERVICE_BASE_URL:http://localhost:8082}
inventory-service.base-url=${INVENTORY_SERVICE_BASE_URL:http://localhost:8083}
auth-service.base-url=${AUTH_SERVICE_BASE_URL:http://localhost:8081}
medsupply.currency=${MEDSUPPLY_CURRENCY:USD}

# CoinDrop Hosted Checkout Configuration
coindrop.base-url=${COINDROP_BASE_URL:http://localhost:8083}
coindrop.client-id=${COINDROP_CLIENT_ID:medsupply-local}
coindrop.partner-secret=${COINDROP_PARTNER_SECRET}
coindrop.webhook-secret=${COINDROP_WEBHOOK_SECRET}
coindrop.max-timestamp-skew-seconds=${COINDROP_MAX_TIMESTAMP_SKEW_SECONDS:300}
coindrop.order-expiry-hours=${COINDROP_ORDER_EXPIRY_HOURS:24}